html{

.logo{
position:fixed;

section{
height:100vh;

.bg{
position:absolute;

.content{

border-radius:40px;

}

.contact{
background:#faf7f2;
min-height:100vh;
padding:120px 20px 60px;
display:flex;
flex-direction:column;
justify-content:center;
}

.contact h2{
text-align:center;
margin-bottom:30px;
font-size:32px;
color:#222;
}

.links{
display:flex;
flex-direction:column;
gap:15px;
width:100%;
max-width:450px;
margin:auto;
}

.links a{
text-decoration:none;
padding:16px;
background:#fff;
border-radius:12px;
color:#000;
text-align:center;
font-size:18px;
box-shadow:0 2px 10px rgba(0,0,0,.12);
}

</style>
</head>
