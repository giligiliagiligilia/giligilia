<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گیلیگیلیا</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:tahoma,sans-serif;
background:#fff;
}

/* LOGO */
.logo{
position:fixed;
top:15px;
right:15px;
width:60px;
height:auto;
z-index:10;
}

/* SECTIONS */
section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
position:relative;
overflow:hidden;
padding:40px 20px;
}

/* BACKGROUND */
.bg{
position:absolute;
width:100%;
height:100%;
background-size:cover;
background-position:center;
background-repeat:no-repeat;
filter:brightness(.85);
transform:scale(1.02);
}

/* CONTENT */
.content{
position:relative;
z-index:2;
text-align:center;
color:white;
padding:20px;
max-width:90%;
}

h1{
font-size:40px;
margin-bottom:15px;
text-shadow:0 0 10px rgba(0,0,0,.5);
}

/* BUTTON */
.btn{
display:inline-block;
padding:14px 25px;
background:white;
color:black;
text-decoration:none;
border-radius:30px;
font-weight:bold;
transition:0.2s;
}

.btn:active{
transform:scale(0.95);
}

/* CONTACT */
.contact{
background:#faf7f2;
color:#222;
}

.contact h2{
margin-bottom:30px;
font-size:32px;
}

.links{
display:flex;
flex-direction:column;
gap:15px;
width:100%;
max-width:400px;
}

.links a{
text-decoration:none;
padding:15px;
background:white;
border-radius:12px;
color:black;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

/* MOBILE */
@media (max-width:768px){

h1{
font-size:28px;
}

.contact h2{
font-size:24px;
}

.btn{
padding:12px 20px;
font-size:14px;
}

section{
min-height:100svh;
padding:30px 15px;
}

}

</style>
</head>

<body>

<img src="images/logo.webp" class="logo">

<section>
<div class="bg" style="background-image:url('images/boxjofer.webp');"></div>

<div class="content">
<h1>باکس جوفر</h1>
<a href="#contact" class="btn">مشاهده جزئیات</a>
</div>
</section>

<section>
<div class="bg" style="background-image:url('images/jofer.webp');"></div>

<div class="content">
<h1>جوفر</h1>
<a href="#contact" class="btn">مشاهده جزئیات</a>
</div>
</section>

<section id="contact" class="contact">

<h2>ارتباط با ما</h2>

<div class="links">

<a href="https://www.instagram.com/giligilia">اینستاگرام</a>
<a href="https://wa.me/989059598095">واتساپ</a>
<a href="https://ble.ir/giligilia">بله</a>
<a href="https://t.me/giligiliacreator">تلگرام</a>
<a href="tel:09059598095">تماس</a>

</div>

</section>

</body>
</html>
